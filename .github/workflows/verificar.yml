name: Verificar LOJUSTO
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis y pruebas
        run: |
          node --check tarifas.js
          node --check proximidad.js
          node --check servicios.js
          node --test tests/*.test.mjs
